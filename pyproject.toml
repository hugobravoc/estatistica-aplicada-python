[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estatistica-aplicada-python"
version = "0.1.0"
description = "Exemplos e exercicios de estatistica implementados em Python"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "matplotlib>=3.8", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
